<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Call</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .video-box {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 350px;
            object-fit: cover;
            background: #222;
        }

        .controls {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #startButton {
            background: #2563eb;
            color: white;
        }

        #endButton {
            background: #dc2626;
            color: white;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .videos {
                grid-template-columns: 1fr;
            }

            video {
                height: 280px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Video Call</h1>

    <div class="videos">

        <div class="video-box">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>

        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

    </div>

    <div class="controls">

        <button id="startButton" onclick="startCall()">
            Start Call
        </button>

        <button id="endButton" onclick="endCall()" disabled>
            End Call
        </button>

    </div>

    <p id="status">
        Ready to start call
    </p>

    <a href="connections.html" class="back">
        ← Back to Connections
    </a>

</div>


<script>

const userId = localStorage.getItem("user_id");

const urlParams = new URLSearchParams(window.location.search);

const receiverId = urlParams.get("receiver_id");

let callId = null;
let localStream = null;
let peerConnection = null;


const configuration = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};


async function startCall() {

    if (!receiverId) {

        document.getElementById("status").textContent =
            "No receiver selected.";

        return;
    }

    try {

        document.getElementById("status").textContent =
            "Starting call...";

        const token =
            localStorage.getItem("access_token");

        const response = await fetch("/api/calls", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },

            body: JSON.stringify({
                receiver_id: parseInt(receiverId)
            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail || "Unable to start call"
            );

        }


        callId = data.call_id;


        /*
         * Ask the browser for camera and microphone access.
         */

        localStream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });


        document.getElementById("localVideo").srcObject =
            localStream;


        /*
         * Create WebRTC connection.
         */

        peerConnection =
            new RTCPeerConnection(configuration);


        localStream.getTracks().forEach(function(track) {

            peerConnection.addTrack(
                track,
                localStream
            );

        });


        peerConnection.ontrack = function(event) {

            document.getElementById("remoteVideo").srcObject =
                event.streams[0];

        };


        document.getElementById("startButton").disabled =
            true;

        document.getElementById("endButton").disabled =
            false;


        document.getElementById("status").textContent =
            "Call started";


    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            error.message;

    }

}


async function endCall() {

    try {

        if (localStream) {

            localStream.getTracks().forEach(function(track) {

                track.stop();

            });

        }


        if (peerConnection) {

            peerConnection.close();

        }


        if (callId) {

            const token =
                localStorage.getItem("access_token");

            const response = await fetch(
                `/api/calls/${callId}/end`,
                {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail || "Unable to end call"
                );

            }

        }


        document.getElementById("localVideo").srcObject =
            null;

        document.getElementById("remoteVideo").srcObject =
            null;


        document.getElementById("startButton").disabled =
            false;

        document.getElementById("endButton").disabled =
            true;


        document.getElementById("status").textContent =
            "Call ended";


        callId = null;


    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            error.message;

    }

}

</script>

</body>

</html>
